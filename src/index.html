<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>NewsPortal</title>
  </head>
  <body>
    <header>
      <h1>News Portal</h1>
    </header>
    <main>
      <div class="sources buttons"></div>
      <div class="news"></div>
    </main>
    <footer>
    <p class="copyright">
        Copyright <a href="https://newsapi.org">NewsAPI</a>
    </p>
    <div class="footer-info">
        <a href="https://github.com/marik98" target="_blank">Мой GitHub</a>
        <span>2024</span>
        <a href="https://rs.school/" target="_blank" class="rs-logo">RS School</a>
    </div>
</footer>

    <template id="sourceItemTemp">
      <div class="source__item">
        <span class="source__item-name"></span>
      </div>
    </template>

    <template id="newsItemTemp">
      <div class="news__item">
        <div class="news__meta">
          <div class="news__meta-photo"></div>
          <ul class="news__meta-details">
            <li class="news__meta-author"></li>
            <li class="news__meta-date"></li>
          </ul>
        </div>
      </div>
    </template>
  </body>
</html>
